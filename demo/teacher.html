<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher dashboard · KidsCode</title><meta name="description" content="KidsCode: a learning platform that teaches kids math, chemistry and programming through games.">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/kp.css"></head>
<body data-page="teacher" data-nav=""><header id="nav" class="nav"></header><main id="main">
<div class="wrap dash"><aside class="side" id="side"></aside><div>
<div class="welcome"><div><h2>Welcome, <span id="hello"></span></h2><p>Your courses and students at a glance.</p></div></div>
<div class="panel on" id="p1"><div class="grid g3" id="stats" style="margin-bottom:24px"></div><div class="grid g2"><div class="card"><h3>Students per course</h3><div id="per"></div></div><div class="card"><h3>Recent enrollments</h3><div id="recent"></div></div></div></div>
<div class="panel" id="p2"><h2 style="font-size:1.8rem">My courses</h2><div id="mycs"></div></div>
<div class="panel" id="p3"><h2 style="font-size:1.8rem">Enrollments</h2><div class="card"><div id="recent2"></div></div></div>
<div class="panel" id="p4"><div class="card" style="max-width:560px"><h2 style="font-size:1.8rem">Add a course</h2><form id="af"><div class="field"><label for="an">Course name</label><input id="an"></div><div class="field"><label for="ah">Hours</label><input id="ah" type="number" min="1" max="200" value="6"></div><button class="btn" type="submit">Add course</button></form></div></div></div></div></main><footer id="foot"></footer><script src="js/kp.js"></script></body></html>
