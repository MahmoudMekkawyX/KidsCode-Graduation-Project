<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learn Chemistry</title><link rel="stylesheet" href="../common.css"></head><body><div class="card"><h1>Learn Chemistry</h1><div class="sub">Which element has this symbol?</div><div id="app"></div><a class="back" href="../../Games.html">&larr; Back to games</a><div class="note">Demo version of this game for the hosted showcase.</div></div><script>
var E=[["H","Hydrogen"],["He","Helium"],["O","Oxygen"],["C","Carbon"],["N","Nitrogen"],["Na","Sodium"],["Fe","Iron"],["Au","Gold"],["Ag","Silver"],["Ca","Calcium"],["Cl","Chlorine"],["K","Potassium"]];
var n=0,s=0,app=document.getElementById("app");
function next(){if(n>=8){app.innerHTML="<div class=q>Score: "+s+" / 8</div><button onclick=\"n=0;s=0;next()\">Play again</button>";return}
 n++;var c=E[Math.floor(Math.random()*E.length)],o=[c];while(o.length<4){var w=E[Math.floor(Math.random()*E.length)];if(o.indexOf(w)<0)o.push(w)}
 o.sort(function(){return Math.random()-.5});
 app.innerHTML="<div class=score>Question "+n+" · Score "+s+"</div><div class=q>"+c[0]+"</div>"+o.map(function(x){return "<button data-v="+x[0]+">"+x[1]+"</button>"}).join("");
 app.querySelectorAll("button").forEach(function(bt){bt.onclick=function(){if(bt.dataset.v==c[0]){s++;bt.classList.add("good")}else bt.classList.add("bad");setTimeout(next,500)}})}
next();</script></body></html>
