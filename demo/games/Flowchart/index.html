<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowchart</title><link rel="stylesheet" href="../common.css"></head><body><div class="card"><h1>Flowchart</h1><div class="sub">Put the steps of making tea in the right order.</div><div id="app"></div><a class="back" href="../../Games.html">&larr; Back to games</a><div class="note">Demo version of this game for the hosted showcase.</div></div><script>
var S=["Boil water","Put tea bag in cup","Pour water","Wait 3 minutes","Enjoy"],app=document.getElementById("app"),nx=0,d=S.slice().sort(function(){return Math.random()-.5});
app.innerHTML="<div class=score id=m>Pick step 1</div>"+d.map(function(x){return "<button style=\"display:block;width:100%\" data-v=\""+x+"\">"+x+"</button>"}).join("");
app.querySelectorAll("button").forEach(function(b){b.onclick=function(){if(b.dataset.v==S[nx]){b.classList.add("good");b.disabled=true;nx++;document.getElementById("m").textContent=nx==S.length?"Correct flow!":"Pick step "+(nx+1)}else{b.classList.add("bad");setTimeout(function(){b.classList.remove("bad")},300)}}})</script></body></html>
