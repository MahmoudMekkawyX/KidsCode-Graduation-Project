<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Arrangement</title><link rel="stylesheet" href="../common.css"></head><body><div class="card"><h1>Game Arrangement</h1><div class="sub">Click the tiles in order from 1 to 9.</div><div id="app"></div><a class="back" href="../../Games.html">&larr; Back to games</a><div class="note">Demo version of this game for the hosted showcase.</div></div><script>
var app=document.getElementById("app"),d=[1,2,3,4,5,6,7,8,9].sort(function(){return Math.random()-.5}),nx=1;
app.innerHTML="<div class=score id=m>Next: 1</div><div class=grid style=\"grid-template-columns:repeat(3,76px)\">"+d.map(function(x){return "<div class=tile data-v="+x+">"+x+"</div>"}).join("")+"</div>";
app.querySelectorAll(".tile").forEach(function(t){t.onclick=function(){if(+t.dataset.v==nx){t.classList.add("good");nx++;document.getElementById("m").textContent=nx>9?"You did it!":"Next: "+nx}else{t.classList.add("bad");setTimeout(function(){t.classList.remove("bad")},300)}}})</script></body></html>
