<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student dashboard · KidsCode</title><meta name="description" content="KidsCode: a learning platform that teaches kids math, chemistry and programming through games.">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/kp.css"></head>
<body data-page="student" data-nav=""><header id="nav" class="nav"></header><main id="main">
<div class="wrap dash"><aside class="side" id="side"></aside><div>
<div class="welcome"><div><h2>Welcome, <span id="hello"></span></h2><p>Here is how your learning is going.</p></div><a class="btn" href="courses.html">Browse courses</a></div>
<div class="panel on" id="p1"><div class="grid g2"><div class="card"><h3>Course completion</h3><div class="ring" id="ring"><span>0%</span></div></div><div class="card"><h3>My grades</h3><div id="grades"></div><h3 style="margin-top:22px">Upcoming</h3><div id="up"></div></div></div></div>
<div class="panel" id="p2"><h2 style="font-size:1.8rem">My courses</h2><div id="mine"></div></div>
<div class="panel" id="p3"><h2 style="font-size:1.8rem">Discover courses</h2><div class="grid g2" id="disc"></div></div>
<div class="panel" id="p4"><div class="card" style="max-width:560px"><h2 style="font-size:1.8rem">Profile</h2><form id="pf"><div class="field"><label for="pn">Name</label><input id="pn"></div><div class="field"><label for="pe">Email</label><input id="pe" readonly></div><div class="field"><label for="pg">Grade</label><input id="pg"></div><button class="btn" type="submit">Save changes</button></form></div></div></div></div></main><footer id="foot"></footer><script src="js/kp.js"></script></body></html>
